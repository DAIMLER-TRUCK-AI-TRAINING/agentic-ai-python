[project]
name = "module01-lab01-llm-behaviour"
version = "0.1.0"
description = "Module 1 · Lab 01 as a uv project: exploring LLM behaviour with OpenAI and Claude"
readme = "README.md"
requires-python = ">=3.12"
# The same pins as labs/setup/requirements.txt, so this project and the notebook behave alike.
dependencies = [
    "anthropic==1.17.0",
    "httpx==0.28.1",
    "openai==2.54.0",
    "pandas==3.1.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "tiktoken==0.14.0",
    "torch==2.14.1",
    "transformers==5.21.0",
]

[project.scripts]
lab01 = "lab01.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.9.21,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lab01"

# CPU-only PyTorch on Linux and Windows: the default PyPI wheels there pull in the CUDA libraries,
# which a 135M-parameter model on a laptop does not need. macOS wheels come from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
