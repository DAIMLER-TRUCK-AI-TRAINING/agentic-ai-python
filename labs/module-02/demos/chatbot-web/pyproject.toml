[project]
name = "chatbot-web"
version = "0.1.0"
description = "Module 2: FastAPI streaming chatbot on LangChain (OpenAI, Claude, Azure OpenAI or Claude on Microsoft Foundry) with a browser UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langchain-anthropic>=1.7.6",
    "openai>=2.45.0",
    # Held below 2.0: anthropic 1.x sends the key as x-api-key, the header the Foundry endpoint reads
    "anthropic>=1.17.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
