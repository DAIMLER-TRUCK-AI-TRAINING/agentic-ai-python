[project]
name = "langchain-agent-azure"
version = "0.1.0"
description = "The new LangChain agent (create_agent) on Azure OpenAI or Claude on Microsoft Foundry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.0",
    "langchain>=1.4.7",
    "langgraph>=1.2.18",
    "langchain-openai>=1.7.3",
    "langchain-anthropic>=1.7.6",
    "openai>=2.45.0",
    # Held below 2.0: anthropic 1.x sends the key as x-api-key, the header the Foundry endpoint reads
    "anthropic>=1.17.0,<2.0.0"
]
